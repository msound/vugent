[package]
name = "vugent-server"
description = "The HTTP server behind vugent's browser UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# frontend/ is built by `npm run build` in web/ and is gitignored, so it is listed here to be packaged.
include = ["/src/", "/build.rs", "/frontend/"]

[dependencies]
vugent-git.workspace = true
vugent-watch.workspace = true
axum.workspace = true
futures-util.workspace = true
getrandom.workspace = true
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
subtle.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true
tower.workspace = true

[lints]
workspace = true
