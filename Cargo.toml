[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/msound/vugent"

[workspace.dependencies]
vugent-git = { path = "crates/git", version = "0.1.0" }
vugent-server = { path = "crates/server", version = "0.1.0" }

anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.8", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower = { version = "0.5.3", features = ["util"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
