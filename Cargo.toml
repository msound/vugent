[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/msound/vugent"

[workspace.dependencies]
vugent-git = { path = "crates/git", version = "0.2.0" }
vugent-server = { path = "crates/server", version = "0.2.0" }
vugent-watch = { path = "crates/watch", version = "0.2.0" }

anyhow = "1.0.104"
axum = "0.8.9"
ignore = "0.4.30"
notify = "8.2.1"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
clap = { version = "4.6.8", features = ["derive"] }
rust-embed = { version = "8.14.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5.3", features = ["util"] }
webbrowser = "1.2.7"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
