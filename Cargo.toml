[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/msound/vugent"

[workspace.dependencies]
vugent-git = { path = "crates/git", version = "0.4.0" }
vugent-highlight = { path = "crates/highlight", version = "0.4.0" }
vugent-server = { path = "crates/server", version = "0.4.0" }
vugent-watch = { path = "crates/watch", version = "0.4.0" }

anyhow = "1.0.104"
axum = "0.8.9"
ignore = "0.4.30"
notify = "8.2.1"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
gethostname = "1.1.0"
getrandom = "0.4.3"
clap = { version = "4.6.8", features = ["derive", "env"] }
rust-embed = { version = "8.14.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
subtle = "2.6.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5.3", features = ["util"] }
# tree-sitter 0.27 needs Rust 1.90.
tree-sitter = "0.26.13"
tree-sitter-highlight = "0.26.13"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-md = "0.5.4"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"
webbrowser = "1.2.7"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
